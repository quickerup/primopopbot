name = "telegram-bot-factory"
main = "src/index.ts"
compatibility_date = "2026-07-31"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# KV namespace: bot registry, configs, secrets blobs, short-TTL "pending" state
# Create with:
#   wrangler kv namespace create BOT_KV
#   wrangler kv namespace create BOT_KV --preview
# then paste the resulting ids below.
# ---------------------------------------------------------------------------
kv_namespaces = [
  { binding = "BOT_KV", id = "bdde911c644c4de7ae4c78374c649105", preview_id = "59b4e85c186244ca9228e93f9644118c" }
]

[triggers]
crons = ["* * * * *", "0 9 * * MON"]

# ---------------------------------------------------------------------------
# Durable Object: one ChatSession instance per "botId:chatId" pair.
# Holds vars, paused ask-flows, and rate-limit counters — this must be a DO,
# not KV, because KV is eventually consistent and too slow for a hot
# conversational loop, and Workers instances aren't guaranteed to persist
# in-memory state between requests.
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "CHAT_SESSION"
class_name = "ChatSession"

[[durable_objects.bindings]]
name = "TOKEN_GENERATION_QUEUE"
class_name = "TokenGenerationQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatSession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TokenGenerationQueue"]

# ---------------------------------------------------------------------------
# Workers AI binding, used by /ai to draft DSL commands from a description.
# ---------------------------------------------------------------------------
[ai]
binding = "AI"

# ---------------------------------------------------------------------------
# Plain (non-secret) vars. Real secrets go in via `wrangler secret put`, see
# setup.sh / README.md. FACTORY_OWNER_ID is the numeric Telegram user id of
# the only person allowed to talk to the factory bot.
# ---------------------------------------------------------------------------
[vars]
FACTORY_OWNER_ID = "8492548344"
# Client API credentials for the BotFather automation HTTP/WebSocket bridge.
# TELEGRAM_API_HASH and TELEGRAM_CLIENT_SESSION should normally be secrets.
TELEGRAM_API_ID = ""
TELEGRAM_CLIENT_API_ENDPOINT = ""

[[d1_databases]]
binding = "ANALYTICS_DB"
database_name = "primopop-analytics"
database_id = "3b003796-6f87-42cd-af0a-e2d605ebd1c3"
